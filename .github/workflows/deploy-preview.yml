name: Deploy Branch Preview

# Deploys a live preview of the rsvp-name-search branch to GitHub Pages
# WITHOUT disturbing production. It rebuilds the current production site
# (from main) at the root and this branch under /preview/, then publishes
# both together as a single Pages deployment.
#
#   Production : https://sulochanawp.github.io/isuri-and-sulochana/
#   Preview    : https://sulochanawp.github.io/isuri-and-sulochana/preview/
#
# No repository settings change is required — Pages source stays "GitHub Actions".

on:
  push:
    branches: [rsvp-name-search]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ── Production build (from main) → site root ────────────────
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-src

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build production (main)
        working-directory: main-src
        env:
          VITE_BASE: /isuri-and-sulochana/
        run: |
          npm install
          npm run build

      # ── Preview build (this branch) → /preview ──────────────────
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          path: preview-src

      - name: Build preview branch
        working-directory: preview-src
        env:
          VITE_BASE: /isuri-and-sulochana/preview/
        run: |
          npm install
          npm run build

      # ── Assemble combined site ──────────────────────────────────
      - name: Assemble site
        run: |
          mkdir -p site
          cp -r main-src/dist/. site/
          mkdir -p site/preview
          cp -r preview-src/dist/. site/preview/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
